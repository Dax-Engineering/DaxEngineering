x-hardening: &hardening
  read_only: true
  tmpfs: ['/tmp']
  cap_drop: ['ALL']
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped

services:
  postgres:
    # postgres:18-alpine with infra/postgres/initdb baked in (infra/docker/postgres.Dockerfile).
    image: ${IMAGE_REGISTRY:?set in Coolify}/dax-postgres:${IMAGE_TAG:?set in Coolify}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in Coolify}
      DAX_DB_NAME: dax
      DAX_MIGRATOR_PASSWORD: ${DAX_MIGRATOR_PASSWORD:?set in Coolify}
      DAX_APP_PASSWORD: ${DAX_APP_PASSWORD:?set in Coolify}
      DAX_BACKUP_PASSWORD: ${DAX_BACKUP_PASSWORD:?set in Coolify}
      TZ: Asia/Colombo
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dax']
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    image: ${IMAGE_REGISTRY}/dax-migrate:${IMAGE_TAG}
    restart: 'no'
    # Runs once and exits; Coolify must not count it as an unhealthy service.
    exclude_from_hc: true
    environment:
      MIGRATOR_DATABASE_URL: postgresql://dax_migrator:${DAX_MIGRATOR_PASSWORD}@postgres:5432/dax
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  api:
    <<: *hardening
    image: ${IMAGE_REGISTRY}/dax-api:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://dax_app:${DAX_APP_PASSWORD}@postgres:5432/dax
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in Coolify}
      INTERNAL_TOKEN_WEB: ${INTERNAL_TOKEN_WEB:?set in Coolify}
      INTERNAL_TOKEN_ADMIN: ${INTERNAL_TOKEN_ADMIN:?set in Coolify}
      WEB_ORIGIN: ${WEB_ORIGIN:?set in Coolify}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?set in Coolify}
      RESEND_API_KEY: ${RESEND_API_KEY:?set in Coolify}
      MAIL_FROM: ${MAIL_FROM:?set in Coolify}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      S3_ENDPOINT: ${S3_ENDPOINT:?set in Coolify}
      S3_BUCKET: ${S3_BUCKET:?set in Coolify}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in Coolify}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set in Coolify}
      S3_REGION: ${S3_REGION:-auto}
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:?set in Coolify}
      DATA_ENCRYPTION_ACTIVE_KEY: ${DATA_ENCRYPTION_ACTIVE_KEY:?set in Coolify}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, egress]

  worker:
    <<: *hardening
    image: ${IMAGE_REGISTRY}/dax-api:${IMAGE_TAG}
    command: ['node', 'worker.js']
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://dax_app:${DAX_APP_PASSWORD}@postgres:5432/dax
      WORKER_POLL_MS: ${WORKER_POLL_MS:-2000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
      WORKER_HEARTBEAT_FILE: /tmp/dax-worker.heartbeat
      WEB_ORIGIN: ${WEB_ORIGIN:?set in Coolify}
      RESEND_API_KEY: ${RESEND_API_KEY:?set in Coolify}
      MAIL_FROM: ${MAIL_FROM:?set in Coolify}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "process.exit(Date.now() - require('fs').statSync('/tmp/dax-worker.heartbeat').mtimeMs < 120000 ? 0 : 1)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, egress]

  web:
    <<: *hardening
    image: ${IMAGE_REGISTRY}/dax-web:${IMAGE_TAG}
    environment:
      API_INTERNAL_URL: http://api:3000
      INTERNAL_TOKEN_WEB: ${INTERNAL_TOKEN_WEB}
      WEB_ORIGIN: ${WEB_ORIGIN}
    tmpfs: ['/tmp', '/app/apps/web/.next/cache']
    depends_on: [api]
    # Coolify joins services that have a domain to its proxy network itself.
    networks: [backend]

  admin:
    <<: *hardening
    image: ${IMAGE_REGISTRY}/dax-admin:${IMAGE_TAG}
    environment:
      API_INTERNAL_URL: http://api:3000
      INTERNAL_TOKEN_ADMIN: ${INTERNAL_TOKEN_ADMIN}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN}
    tmpfs: ['/tmp', '/app/apps/admin/.next/cache']
    depends_on: [api]
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
    internal: true
  egress: {}

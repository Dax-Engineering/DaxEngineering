name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {
              name: dax-api,
              file: infra/docker/api.Dockerfile,
              target: api,
              app: '',
            }
          - {
              name: dax-migrate,
              file: infra/docker/api.Dockerfile,
              target: migrate,
              app: '',
            }
          - {
              name: dax-postgres,
              file: infra/docker/postgres.Dockerfile,
              target: '',
              app: '',
            }
          - {
              name: dax-web,
              file: infra/docker/next.Dockerfile,
              target: runtime,
              app: web,
            }
          - {
              name: dax-admin,
              file: infra/docker/next.Dockerfile,
              target: runtime,
              app: admin,
            }
          - {
              name: dax-backup,
              file: infra/backup/Dockerfile,
              target: '',
              app: '',
            }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: APP=${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.event.inputs.environment || 'staging' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
        run: |
          for name in COOLIFY_URL COOLIFY_TOKEN COOLIFY_RESOURCE_UUID; do
            test -n "${!name}" || { echo "$name is not set for this environment"; exit 1; }
          done
          curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_RESOURCE_UUID}&force=false"
